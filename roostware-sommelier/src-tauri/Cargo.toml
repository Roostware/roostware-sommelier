[package]
name = "roostware-sommelier"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "roostware_sommelier_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
uuid = { version = "1.29.2", features = ["v7"] }
thiserror = "2.0.21"
# Talks to LeetCode's (unofficial) run/submit API. native-tls = the OS TLS stack (Schannel on Windows).
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "gzip"] }
tokio = { version = "1", features = ["time"] }
# Keeps the LeetCode login in the OS credential store rather than in a file (Windows and macOS
# only: without a platform backend keyring would silently fall back to a throwaway mock store).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"

